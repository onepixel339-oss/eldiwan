<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الديوان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root {
  --diwan-paper: #EBE0C6;
  --diwan-paper-soft: #F3EBD8;
  --diwan-desk: #B99B6B;
  --diwan-desk-dark: #93773F;
  --diwan-kraft: #C6A876;
  --diwan-kraft-dark: #8A6B3E;
  --diwan-ink: #26344A;
  --diwan-ink-soft: #4A5C78;
  --diwan-burnt: #8B4A38;
  --diwan-success: #2E6E45;
  --diwan-error: #A6362A;
  --diwan-amber: #C69A44;
  --font-display: 'Aref Ruqaa', serif;
  --font-body: 'Cairo', sans-serif;
  --ease-diwan: cubic-bezier(.34,1.56,.64,1);
  --ease-press: cubic-bezier(.4,0,.2,1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-body);
  background: var(--diwan-desk);
  color: var(--diwan-ink);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* Wood texture noise overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  opacity: 0.15;
  pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='256' height='256' filter='url(%23n)' opacity='0.6'/%3E%3C/svg%3E");
  background-size: 256px 256px;
}

/* Paper texture */
.paper-texture {
  background: var(--diwan-paper);
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='256' height='256' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E");
  background-size: 256px 256px;
  border: 2px solid var(--diwan-kraft);
  box-shadow: 0 4px 20px rgba(0,0,0,0.15), inset 0 0 30px rgba(0,0,0,0.04);
}

/* ========== SCREEN SYSTEM ========== */
.screen {
  display: none;
  position: relative;
  z-index: 1;
  min-height: 100vh;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.screen.active {
  display: flex;
  animation: screenIn 0.5s var(--ease-diwan) forwards;
}
.screen.fade-out {
  animation: screenOut 0.35s ease-in forwards;
}

@keyframes screenIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes screenOut {
  from { opacity: 1; transform: translateY(0); }
  to { opacity: 0; transform: translateY(-15px); }
}

/* ========== MUTE BUTTON ========== */
.mute-btn {
  position: fixed;
  top: 16px;
  left: 16px;
  z-index: 1000;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 2px solid var(--diwan-kraft);
  background: var(--diwan-paper);
  color: var(--diwan-ink);
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  transition: transform 0.15s var(--ease-press);
}
.mute-btn:active { transform: scale(0.9); }

/* ========== ENTRY SCREEN ========== */
.entry-paper {
  width: 100%;
  max-width: 420px;
  border-radius: 8px;
  padding: 32px 24px;
  text-align: center;
  transform: translateY(60px);
  opacity: 0;
  animation: paperDrop 0.7s var(--ease-diwan) 0.2s forwards;
}

@keyframes paperDrop {
  from { transform: translateY(60px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.entry-title {
  font-family: var(--font-display);
  font-size: 3rem;
  font-weight: 700;
  color: var(--diwan-ink);
  margin-bottom: 4px;
  opacity: 0;
  animation: seqReveal 0.5s var(--ease-diwan) 0.5s forwards;
}
.entry-subtitle {
  font-size: 0.95rem;
  color: var(--diwan-ink-soft);
  margin-bottom: 24px;
  opacity: 0;
  animation: seqReveal 0.5s var(--ease-diwan) 0.65s forwards;
}

@keyframes seqReveal {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Photo slot */
.photo-slot {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  border: 2.5px dashed var(--diwan-kraft);
  margin: 0 auto 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  overflow: hidden;
  position: relative;
  background: var(--diwan-paper-soft);
  opacity: 0;
  animation: seqReveal 0.5s var(--ease-diwan) 0.8s forwards;
  transition: border-color 0.3s, box-shadow 0.3s;
}
.photo-slot:hover {
  border-color: var(--diwan-ink);
  box-shadow: 0 0 12px rgba(38,52,74,0.15);
}
.photo-slot img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}
.photo-slot .placeholder {
  font-size: 2rem;
  color: var(--diwan-kraft);
}

/* Name input */
.name-input-wrap {
  margin: 0 auto 20px;
  max-width: 260px;
  opacity: 0;
  animation: seqReveal 0.5s var(--ease-diwan) 0.95s forwards;
}
.name-input {
  width: 100%;
  text-align: center;
  font-family: var(--font-display);
  font-size: 1.3rem;
  color: var(--diwan-ink);
  background: transparent;
  border: none;
  border-bottom: 2px solid var(--diwan-kraft);
  padding: 8px 4px;
  outline: none;
  transition: border-color 0.3s;
}
.name-input:focus { border-bottom-color: var(--diwan-ink); }
.name-input::placeholder { color: var(--diwan-kraft); }

/* Avatar grid */
.avatar-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
  max-width: 280px;
  margin: 0 auto 24px;
  opacity: 0;
  animation: seqReveal 0.5s var(--ease-diwan) 1.1s forwards;
}
.avatar-stamp {
  width: 48px;
  height: 48px;
  border-radius: 8px;
  border: 2px solid var(--diwan-kraft);
  background: var(--diwan-paper-soft);
  font-size: 1.5rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s var(--ease-press);
}
.avatar-stamp:hover { transform: scale(1.1); }
.avatar-stamp.selected {
  border-color: var(--diwan-ink);
  background: var(--diwan-ink);
  box-shadow: 0 2px 8px rgba(38,52,74,0.3);
  transform: scale(1.05);
}

/* Submit button */
.submit-btn {
  font-family: var(--font-display);
  font-size: 1.2rem;
  padding: 12px 48px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  background: var(--diwan-kraft);
  color: var(--diwan-paper-soft);
  box-shadow: 0 4px 0 var(--diwan-kraft-dark);
  transition: all 0.15s var(--ease-press);
  opacity: 0;
  animation: seqReveal 0.5s var(--ease-diwan) 1.25s forwards;
}
.submit-btn:disabled {
  background: var(--diwan-kraft);
  color: rgba(243,235,216,0.5);
  cursor: not-allowed;
  box-shadow: 0 4px 0 var(--diwan-kraft-dark);
  transform: none;
}
.submit-btn:not(:disabled) {
  background: var(--diwan-ink);
  box-shadow: 0 4px 0 var(--diwan-ink-soft);
  color: var(--diwan-paper);
}
.submit-btn:not(:disabled):active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 var(--diwan-ink-soft);
}

/* Form glow */
.form-glow {
  position: absolute;
  inset: -4px;
  border-radius: 12px;
  opacity: 0;
  transition: opacity 0.5s;
  pointer-events: none;
  box-shadow: 0 0 20px var(--diwan-amber), 0 0 40px rgba(198,154,68,0.3);
}
.form-glow.active { opacity: 1; }

/* ========== GAMEPLAY SCREEN ========== */
.game-container {
  width: 100%;
  max-width: 460px;
  padding: 0 16px;
}

/* Top bar */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.streak-box {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--diwan-paper);
  padding: 6px 14px;
  border-radius: 8px;
  border: 1.5px solid var(--diwan-kraft);
  font-family: var(--font-display);
  font-size: 1rem;
}
.streak-box .streak-fire { font-size: 1.1rem; }
.powerups {
  display: flex;
  gap: 8px;
}
.powerup-btn {
  padding: 6px 12px;
  border-radius: 8px;
  border: 1.5px solid var(--diwan-kraft);
  background: var(--diwan-paper);
  font-family: var(--font-body);
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--diwan-ink);
  cursor: pointer;
  transition: all 0.2s var(--ease-press);
  position: relative;
}
.powerup-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.powerup-btn:not(:disabled):active {
  transform: scale(0.93);
}
.powerup-btn.fifty-fifty:not(:disabled) { border-color: var(--diwan-amber); }
.powerup-btn.freeze:not(:disabled) { border-color: #4A90D9; }

/* Freeze badge */
.freeze-badge {
  position: absolute;
  top: -8px;
  right: -8px;
  background: #4A90D9;
  color: white;
  font-size: 0.65rem;
  padding: 2px 6px;
  border-radius: 4px;
  animation: pulse 0.5s ease-in-out infinite alternate;
}

/* Candle timer */
.candle-wrap {
  text-align: center;
  margin-bottom: 12px;
}
.candle-svg {
  width: 50px;
  height: 100px;
}
.candle-time {
  font-family: var(--font-display);
  font-size: 1.1rem;
  color: var(--diwan-ink);
  margin-top: 4px;
}

/* Flame flicker */
@keyframes flicker {
  0%, 100% { transform: scaleY(1) scaleX(1); }
  25% { transform: scaleY(1.1) scaleX(0.9); }
  50% { transform: scaleY(0.9) scaleX(1.1); }
  75% { transform: scaleY(1.05) scaleX(0.95); }
}
@keyframes flickerFast {
  0%, 100% { transform: scaleY(1) scaleX(1); }
  20% { transform: scaleY(1.2) scaleX(0.8); }
  40% { transform: scaleY(0.8) scaleX(1.2); }
  60% { transform: scaleY(1.15) scaleX(0.85); }
  80% { transform: scaleY(0.85) scaleX(1.15); }
}
.flame-normal { animation: flicker 0.4s ease-in-out infinite; transform-origin: bottom center; }
.flame-urgent { animation: flickerFast 0.2s ease-in-out infinite; transform-origin: bottom center; }

/* Question card */
.question-card {
  border-radius: 12px;
  padding: 24px 20px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.cat-badge {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 700;
  margin-bottom: 12px;
  color: white;
}
.cat-culture { background: var(--diwan-burnt); }
.cat-sport { background: var(--diwan-success); }
.cat-logic { background: var(--diwan-amber); }

.question-text {
  font-family: var(--font-display);
  font-size: 1.2rem;
  line-height: 1.7;
  margin-bottom: 20px;
  color: var(--diwan-ink);
}

/* Options */
.options-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.option-btn {
  padding: 12px 8px;
  border-radius: 10px;
  border: 2px solid var(--diwan-kraft);
  background: var(--diwan-paper-soft);
  font-family: var(--font-body);
  font-size: 1rem;
  font-weight: 600;
  color: var(--diwan-ink);
  cursor: pointer;
  transition: all 0.2s var(--ease-press);
  position: relative;
}
.option-btn:hover:not(:disabled) {
  border-color: var(--diwan-ink);
  transform: translateY(-2px);
  box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}
.option-btn:active:not(:disabled) { transform: translateY(0); }
.option-btn:disabled { cursor: default; }
.option-btn.correct {
  border-color: var(--diwan-success);
  background: rgba(46,110,69,0.12);
}
.option-btn.wrong {
  border-color: var(--diwan-error);
  background: rgba(166,54,42,0.12);
}
.option-btn.strikethrough {
  text-decoration: line-through;
  opacity: 0.35;
  pointer-events: none;
}

/* Stamp animation */
.stamp-overlay {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0) rotate(-15deg);
  font-family: var(--font-display);
  font-size: 2.5rem;
  font-weight: 700;
  padding: 8px 20px;
  border-radius: 8px;
  border: 4px solid;
  opacity: 0;
  pointer-events: none;
  z-index: 10;
}
.stamp-overlay.stamp-success {
  color: var(--diwan-success);
  border-color: var(--diwan-success);
  background: rgba(46,110,69,0.08);
}
.stamp-overlay.stamp-error {
  color: var(--diwan-error);
  border-color: var(--diwan-error);
  background: rgba(166,54,42,0.08);
}
.stamp-overlay.animate {
  animation: stampIn 0.4s var(--ease-diwan) forwards;
}
@keyframes stampIn {
  from { transform: translate(-50%, -50%) scale(0) rotate(-15deg); opacity: 0; }
  to { transform: translate(-50%, -50%) scale(1) rotate(-8deg); opacity: 1; }
}

/* Shake */
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(6px); }
}
.shake { animation: shake 0.4s ease-out; }

/* Float points */
.float-points {
  position: fixed;
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--diwan-success);
  pointer-events: none;
  z-index: 100;
  animation: floatUp 1s ease-out forwards;
}
@keyframes floatUp {
  from { opacity: 1; transform: translateY(0); }
  to { opacity: 0; transform: translateY(-60px); }
}

/* Streak notification */
.streak-notif {
  position: fixed;
  top: 20%;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--font-display);
  font-size: 1.3rem;
  padding: 10px 24px;
  border-radius: 12px;
  background: var(--diwan-amber);
  color: white;
  z-index: 200;
  animation: streakPop 1.5s var(--ease-diwan) forwards;
  pointer-events: none;
}
@keyframes streakPop {
  0% { opacity: 0; transform: translateX(-50%) scale(0.5); }
  20% { opacity: 1; transform: translateX(-50%) scale(1.1); }
  40% { transform: translateX(-50%) scale(1); }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
}

/* Slide card */
@keyframes slideInRight {
  from { transform: translateX(80px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
@keyframes slideOutLeft {
  from { transform: translateX(0); opacity: 1; }
  to { transform: translateX(-80px); opacity: 0; }
}
.card-slide-in { animation: slideInRight 0.35s var(--ease-diwan) forwards; }
.card-slide-out { animation: slideOutLeft 0.25s ease-in forwards; }

/* ========== BONUS SCREEN ========== */
.bonus-intro {
  width: 100%;
  max-width: 420px;
  border-radius: 12px;
  padding: 32px 24px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.bonus-intro-bg {
  background: var(--diwan-kraft-dark);
  color: var(--diwan-paper);
  border-color: var(--diwan-desk-dark);
}
.secret-stamp {
  position: absolute;
  top: 20px;
  left: 20px;
  font-family: var(--font-display);
  font-size: 1.8rem;
  color: rgba(235,224,198,0.25);
  transform: rotate(-25deg);
  border: 3px solid rgba(235,224,198,0.25);
  padding: 4px 14px;
  border-radius: 6px;
  pointer-events: none;
}
.bonus-title {
  font-family: var(--font-display);
  font-size: 1.6rem;
  margin-bottom: 16px;
}
.bonus-rules {
  font-size: 0.95rem;
  margin-bottom: 24px;
  opacity: 0.85;
  line-height: 1.8;
}
.bonus-btns {
  display: flex;
  gap: 12px;
  justify-content: center;
}
.bonus-btn {
  padding: 10px 24px;
  border-radius: 8px;
  font-family: var(--font-display);
  font-size: 1.05rem;
  cursor: pointer;
  border: none;
  transition: all 0.15s var(--ease-press);
}
.bonus-btn-risk {
  background: var(--diwan-burnt);
  color: var(--diwan-paper);
  box-shadow: 0 3px 0 rgba(139,74,56,0.6);
}
.bonus-btn-skip {
  background: var(--diwan-ink-soft);
  color: var(--diwan-paper);
  box-shadow: 0 3px 0 rgba(38,52,74,0.5);
}
.bonus-btn:active { transform: translateY(2px); }

/* Bonus play */
.bonus-score-indicator {
  font-family: var(--font-display);
  font-size: 1.4rem;
  margin-bottom: 12px;
  transition: color 0.3s;
}
.bonus-score-indicator.pulse-green { animation: pulseGreen 0.5s; }
.bonus-score-indicator.pulse-red { animation: pulseRed 0.5s; }
@keyframes pulseGreen {
  0% { color: var(--diwan-success); transform: scale(1.2); }
  100% { color: inherit; transform: scale(1); }
}
@keyframes pulseRed {
  0% { color: var(--diwan-error); transform: scale(1.2); }
  100% { color: inherit; transform: scale(1); }
}

.progress-stamps {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-bottom: 16px;
  font-size: 1.2rem;
}
.progress-stamps span {
  opacity: 0.3;
  transition: opacity 0.3s;
}
.progress-stamps span.done { opacity: 1; }
.progress-stamps span.correct-stamp { color: var(--diwan-success); }
.progress-stamps span.wrong-stamp { color: var(--diwan-error); }

/* Bonus end */
.bonus-end {
  text-align: center;
  padding: 32px;
}
.bonus-final-stamp {
  font-family: var(--font-display);
  font-size: 2rem;
  padding: 10px 30px;
  border-radius: 10px;
  border: 4px solid;
  display: inline-block;
  margin: 16px 0;
  animation: stampIn 0.5s var(--ease-diwan) forwards;
}
.bonus-final-stamp.accepted {
  color: var(--diwan-success);
  border-color: var(--diwan-success);
}
.bonus-final-stamp.rejected {
  color: var(--diwan-error);
  border-color: var(--diwan-error);
}

/* ========== CERTIFICATE SCREEN ========== */
.certificate-container {
  width: 100%;
  max-width: 440px;
  transform: translateY(40px);
  opacity: 0;
}
.certificate-container.unroll {
  animation: unrollCert 0.8s var(--ease-diwan) forwards;
}
@keyframes unrollCert {
  from { transform: translateY(40px) scaleY(0.3); opacity: 0; }
  to { transform: translateY(0) scaleY(1); opacity: 1; }
}

.certificate {
  position: relative;
  padding: 28px 20px;
  text-align: center;
  border-radius: 4px;
  overflow: hidden;
}

/* Decorative edges */
.cert-edge-top, .cert-edge-bottom {
  position: absolute;
  left: 0;
  right: 0;
  height: 14px;
  background: repeating-linear-gradient(
    45deg,
    var(--diwan-kraft) 0px,
    var(--diwan-kraft) 6px,
    var(--diwan-paper) 6px,
    var(--diwan-paper) 12px
  );
}
.cert-edge-top { top: 0; }
.cert-edge-bottom { bottom: 0; }

.cert-inner {
  border: 2px solid var(--diwan-ink);
  outline: 2px dashed var(--diwan-kraft);
  outline-offset: 6px;
  padding: 24px 16px;
  position: relative;
}

.cert-photo-slot {
  width: 90px;
  height: 120px;
  aspect-ratio: 3/4;
  border-radius: 6px;
  border: 3px solid var(--diwan-ink);
  outline: 1.5px solid var(--diwan-kraft);
  outline-offset: -4px;
  margin: 0 auto 12px;
  overflow: hidden;
  cursor: pointer;
  background: var(--diwan-paper-soft);
  display: flex;
  align-items: center;
  justify-content: center;
}
.cert-photo-slot img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.cert-eyebrow {
  font-size: 0.8rem;
  color: var(--diwan-ink-soft);
  letter-spacing: 2px;
  margin-bottom: 4px;
}
.cert-title {
  font-family: var(--font-display);
  font-size: 1.5rem;
  color: var(--diwan-ink);
  margin-bottom: 8px;
}
.cert-name {
  font-family: var(--font-display);
  font-size: 1.8rem;
  color: var(--diwan-burnt);
  margin-bottom: 16px;
}
.cert-score-block {
  margin: 16px 0;
}
.cert-score-num {
  font-family: var(--font-display);
  font-size: 3rem;
  color: var(--diwan-ink);
}
.cert-score-label {
  font-size: 0.85rem;
  color: var(--diwan-ink-soft);
}

/* Tiered stamps */
.cert-stamp {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 1.1rem;
  font-weight: 700;
  padding: 8px 16px;
  margin: 12px auto;
  animation: boomStamp 0.6s var(--ease-diwan) forwards;
}

/* امتياز 90-100%: ذهبي/كهرماني غامق، دائرة مزدوجة بحواف مسننة */
.cert-stamp.tier-excellent {
  color: #B8860B;
  border: 3px solid #B8860B;
  background: rgba(184,134,11,0.08);
  border-radius: 50%;
  width: 90px;
  height: 90px;
  position: relative;
}
.cert-stamp.tier-excellent::before {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 2px dashed #C69A44;
  animation: rotateSlow 20s linear infinite;
}
@keyframes rotateSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* جيد جدًا 75-89%: أخضر، دائرة عادية */
.cert-stamp.tier-verygood {
  color: var(--diwan-success);
  border: 3px solid var(--diwan-success);
  background: rgba(46,110,69,0.08);
  border-radius: 50%;
  width: 85px;
  height: 85px;
}

/* مقبول 50-74%: كحلي، مستطيل بسيط */
.cert-stamp.tier-good {
  color: var(--diwan-ink);
  border: 2px solid var(--diwan-ink);
  background: rgba(38,52,74,0.06);
  border-radius: 4px;
  padding: 8px 20px;
}

/* ضعيف 25-49%: برتقالي محروق، مستطيل بحدود متقطعة */
.cert-stamp.tier-weak {
  color: #CC5500;
  border: 2px dashed #CC5500;
  background: rgba(204,85,0,0.06);
  border-radius: 4px;
  padding: 8px 18px;
}

/* مرفوض 0-24%: أحمر، مستطيل بخط قطري */
.cert-stamp.tier-rejected {
  color: var(--diwan-error);
  border: 2px solid var(--diwan-error);
  background: rgba(166,54,42,0.06);
  border-radius: 4px;
  padding: 8px 18px;
  position: relative;
  overflow: visible;
}
.cert-stamp.tier-rejected::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 120%;
  height: 2px;
  background: var(--diwan-error);
  transform: translate(-50%, -50%) rotate(-25deg);
}

@keyframes boomStamp {
  0% { transform: scale(0) rotate(-30deg); opacity: 0; }
  50% { transform: scale(1.2) rotate(5deg); opacity: 1; }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}

/* Badges */
.badges-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin: 16px 0;
}
.badge {
  font-size: 0.8rem;
  padding: 4px 12px;
  border-radius: 20px;
  background: rgba(38,52,74,0.08);
  color: var(--diwan-ink);
  opacity: 0;
  animation: badgeIn 0.4s var(--ease-diwan) forwards;
}
@keyframes badgeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Egyptian phrase */
.cert-phrase {
  font-family: var(--font-display);
  font-size: 1.1rem;
  color: var(--diwan-burnt);
  margin-top: 8px;
  opacity: 0;
  animation: fadeUp 0.5s var(--ease-diwan) forwards;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Cert buttons */
.cert-btns {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-top: 20px;
}
.cert-btn {
  padding: 10px 24px;
  border-radius: 8px;
  font-family: var(--font-body);
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  border: none;
  transition: all 0.15s var(--ease-press);
}
.cert-btn-share {
  background: var(--diwan-ink);
  color: var(--diwan-paper);
}
.cert-btn-download {
  background: var(--diwan-success);
  color: white;
}
.cert-btn:active { transform: scale(0.95); }

/* ========== UTILITIES ========== */
@keyframes pulse {
  from { opacity: 1; }
  to { opacity: 0.6; }
}

/* Score counter animation */
.count-up {
  display: inline-block;
}

/* Responsive */
@media (max-width: 380px) {
  .entry-title { font-size: 2.4rem; }
  .options-grid { grid-template-columns: 1fr; }
  .avatar-grid { grid-template-columns: repeat(5, 1fr); gap: 6px; }

::-webkit-scrollbar-track { background: var(--diwan-desk); }
::-webkit-scrollbar-thumb { background: var(--diwan-kraft); border-radius: 3px; }
</style>
</head>

<script>
// ==================== STATE ====================
const state = {
  playerName: '',
  playerAvatar: '',
  playerPhoto: '',
  mainScore: 0,
  bonusScore: 0,
  totalScore: 0,
  correctCount: 0,
  wrongCount: 0,
  maxStreak: 0,
  currentStreak: 0,
  answerTimes: [],
  hasFifty: true,
  hasFreeze: true,
  freezeActive: false,
  isMuted: localStorage.getItem('diwanMuted') === 'true',
  currentQuestion: 0,
  bonusCurrentQ: 0,
  bonusCorrect: 0,
  bonusWrong: 0,
};

// ==================== QUESTIONS ====================
const POINTS_PER_QUESTION = 10;
const BONUS_POINTS_CORRECT = 15;
const BONUS_POINTS_WRONG = -10;

const mainQuestions = [
  { cat:'culture', catLabel:'ثقافة عامة', text:'إيه اسم أول رئيس لجمهورية مصر العربية؟', options:['محمد نجيب','جمال عبدالناصر','أنور السادات','حسني مبارك'], correct:0 },
  { cat:'sport', catLabel:'رياضة ومعادلة', text:'كام لاعب في فريق كرة القدم داخل الملعب؟', options:['9','10','11','12'], correct:2 },
  { cat:'logic', catLabel:'لغز تفكير', text:'إيه اللي بيزيد كل ما تاخد منه؟', options:['الحفرة','الوقت','المال','العمر'], correct:0 },
  { cat:'culture', catLabel:'ثقافة عامة', text:'نهر النيل بيصب في إيه؟', options:['الخليج العربي','البحر الأحمر','البحر المتوسط','المحيط الأطلنطي'], correct:2 },
  { cat:'logic', catLabel:'لغز تفكير', text:'شيء له أسنان ومايعضّش؟', options:['التمساح','المشط','السكين','الثعبان'], correct:1 },
];

const bonusQuestions = [
  { text:'كام قارة في العالم؟', options:['5','6','7','4'], correct:2 },
  { text:'إيه أكبر محيط في الأرض؟', options:['الأطلنطي','الهندي','الهادي','المتجمد الشمالي'], correct:2 },
  { text:'مين اللي اخترع المصباح الكهربائي؟', options:['نيوتن','أديسون','أينشتاين','تسلا'], correct:1 },
  { text:'كام لون في قوس قزح؟', options:['5','6','7','8'], correct:2 },
];

// ==================== EGYPTIAN PHRASES BY TIER ====================
const egyptianPhrases = {
  excellent: [
    "يا نهار أبيض، ده انت جامد يا معلم!",
    "تسلم الأيادي بجد يا وحش",
    "ما شاء الله عليك، مفيش كلام",
    "ده احنا قدام عبقري ولا إيه؟"
  ],
  verygood: [
    "مش بطال خالص، كمّل كده",
    "تمام يا كبير، شغل نضيف",
    "لسه شوية وتبقى فوق الكل",
    "حلو أوي، بس المرة الجاية كمّلها امتياز"
  ],
  good: [
    "تمام كده، خلاص كفاية عليك",
    "معقول يعني، مش وحش",
    "على قد الحال، ولا يهمك",
    "خدت نص الطريق، كمّل الباقي"
  ],
  weak: [
    "يا سيدي إحنا مش هنقفل الملف كده",
    "معلش يا كبير، وسّع دماغك شوية",
    "فيه حاجة غلط في المذاكرة يا صاحبي",
    "لسه قدامك مشوار يا نجم"
  ],
  rejected: [
    "ارجع زي ما جيت يا باشا",
    "يلا يفتح الله، بكرة أحسن",
    "الملف اتقفل، جرب تاني يا كبير",
    "معلش، مش كل مرة بتسلم الجرة"
  ]
};

// ==================== CENTRAL TIER CALCULATOR ====================
/**
 * Calculates the tier, stamp config, and phrase based on player score and max possible score.
 * @param {number} playerScore - The player's actual total score
 * @param {number} maxPossibleScore - The maximum possible score (calculated from questions)
 * @returns {{tier: string, stampClass: string, stampText: string, phrase: string}}
 */
function calculateTier(playerScore, maxPossibleScore) {
  // Calculate percentage, clamped between 0 and 100
  let percentage = maxPossibleScore > 0 ? (playerScore / maxPossibleScore) * 100 : 0;
  percentage = Math.max(0, Math.min(100, percentage));
  
  let tier, stampClass, stampText, phraseArray;
  
  if (percentage >= 90) {
    tier = 'excellent';
    stampClass = 'tier-excellent';
    stampText = 'امتياز';
    phraseArray = egyptianPhrases.excellent;
  } else if (percentage >= 75) {
    tier = 'verygood';
    stampClass = 'tier-verygood';
    stampText = 'جيد جدًا';
    phraseArray = egyptianPhrases.verygood;
  } else if (percentage >= 50) {
    tier = 'good';
    stampClass = 'tier-good';
    stampText = 'مقبول';
    phraseArray = egyptianPhrases.good;
  } else if (percentage >= 25) {
    tier = 'weak';
    stampClass = 'tier-weak';
    stampText = 'ضعيف';
    phraseArray = egyptianPhrases.weak;
  } else {
    tier = 'rejected';
    stampClass = 'tier-rejected';
    stampText = 'مرفوض';
    phraseArray = egyptianPhrases.rejected;
  }
  
  // Pick a random phrase from the tier's array
  const randomIndex = Math.floor(Math.random() * phraseArray.length);
  const phrase = phraseArray[randomIndex];
  
  return { tier, stampClass, stampText, phrase };
}

/**
 * Calculates the maximum possible score based on current questions configuration.
 * @returns {number}
 */
function calculateMaxPossibleScore() {
  const mainMax = mainQuestions.length * POINTS_PER_QUESTION;
  // Bonus round: max is all correct (one question worth BONUS_POINTS_CORRECT)
  const bonusMax = BONUS_POINTS_CORRECT;
  return mainMax + bonusMax;
}

// ==================== SOUND SYSTEM ====================
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playSound(fn) {
  if (state.isMuted) return;
  try { fn(getAudioCtx()); } catch(e) {}
}

const Sound = {
  penTap() {
    playSound(ctx => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.value = 800;
      gain.gain.value = 0.15;
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
      osc.connect(gain).connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.06);
    });
  },

  stamp(type) {
    playSound(ctx => {
      // Noise burst
      const bufSize = ctx.sampleRate * 0.15;
      const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * 0.3;
      const noise = ctx.createBufferSource();
      noise.buffer = buf;
      const noiseGain = ctx.createGain();
      noiseGain.gain.value = 0.2;
      noiseGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
      noise.connect(noiseGain).connect(ctx.destination);
      noise.start(); noise.stop(ctx.currentTime + 0.15);

      // Low thump
      const osc = ctx.createOscillator();
      const oscGain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = type === 'success' ? 120 : 90;
      oscGain.gain.value = 0.4;
      oscGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
      osc.connect(oscGain).connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.2);
    });
  },

  paperRustle() {
    playSound(ctx => {
      const bufSize = ctx.sampleRate * 0.3;
      const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1);
      const noise = ctx.createBufferSource();
      noise.buffer = buf;
      const hp = ctx.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 3000;
      const gain = ctx.createGain();
      gain.gain.value = 0.08;
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
      noise.connect(hp).connect(gain).connect(ctx.destination);
      noise.start(); noise.stop(ctx.currentTime + 0.3);
    });
  },

  tick() {
    playSound(ctx => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.value = 1200;
      gain.gain.value = 0.1;
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
      osc.connect(gain).connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.04);
    });
  },

  unroll() {
    playSound(ctx => {
      const bufSize = ctx.sampleRate * 0.6;
      const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1);
      const noise = ctx.createBufferSource();
      noise.buffer = buf;
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 1000;
      bp.Q.value = 0.5;
      // Sweep frequency
      bp.frequency.linearRampToValueAtTime(4000, ctx.currentTime + 0.6);
      const gain = ctx.createGain();
      gain.gain.value = 0.12;
      gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.6);
      noise.connect(bp).connect(gain).connect(ctx.destination);
      noise.start(); noise.stop(ctx.currentTime + 0.6);
    });
  }
};

// ==================== MUTE ====================
function toggleMute() {
  state.isMuted = !state.isMuted;
  localStorage.setItem('diwanMuted', state.isMuted);
  document.getElementById('muteBtn').textContent = state.isMuted ? '🔇' : '🔊';
}
// Init mute button
if (state.isMuted) document.getElementById('muteBtn').textContent = '🔇';

// ==================== SCREEN TRANSITIONS ====================
function switchScreen(from, to) {
  const fromEl = document.getElementById(from);
  const toEl = document.getElementById(to);
  fromEl.classList.add('fade-out');
  setTimeout(() => {
    fromEl.classList.remove('active', 'fade-out');
    fromEl.style.display = 'none';
    toEl.style.display = '';
    toEl.classList.add('active');
  }, 350);
}

// ==================== ENTRY SCREEN ====================
const avatars = ['🪔','🫖','🔑','📎','🥁','📜','🕯️','🧭','🎟️','🖋️'];

avatars.forEach((emoji, i) => {

function selectAvatar(index, emoji) {

    b.classList.toggle('selected', i === index);
  });

}

document.getElementById('nameInput').addEventListener('input', function() {
  checkEntryForm();
});

function checkEntryForm() {
  const name = document.getElementById('nameInput').value.trim();

// Photo upload
document.getElementById('photoInput').addEventListener('change', function(e) {

  reader.onload = function(ev) {

// ==================== START GAME ====================
function startGame() {
  state.playerName = document.getElementById('nameInput').value.trim();
  Sound.stamp('success');
  switchScreen('screenEntry', 'screenGame');
  setTimeout(() => loadQuestion(0), 400);
}

// ==================== GAMEPLAY ENGINE ====================
let timerInterval = null;
let timeLeft = 15;
let questionStartTime = 0;
const QUESTION_TIME = 15;

function loadQuestion(index) {
  if (index >= mainQuestions.length) {
    endMainGame();
    return;
  }
  state.currentQuestion = index;
  const q = mainQuestions[index];
  questionStartTime = Date.now();

  // Card slide animation
  const card = document.getElementById('questionCard');
  card.classList.remove('card-slide-in', 'card-slide-out');
  void card.offsetWidth; // force reflow
  card.classList.add('card-slide-in');
  Sound.paperRustle();

  // Category badge
  const badge = document.getElementById('catBadge');
  badge.textContent = q.catLabel;
  badge.className = 'cat-badge cat-' + q.cat;

  // Question text
  document.getElementById('questionText').textContent = q.text;

  // Options
  const grid = document.getElementById('optionsGrid');
  grid.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(i);
    grid.appendChild(btn);
  });

  // Reset stamp
  const stamp = document.getElementById('stampOverlay');
  stamp.className = 'stamp-overlay';
  stamp.textContent = '';

  // Reset powerup visual
  document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('strikethrough'));

  // Start timer
  startTimer();
}

function startTimer() {
  clearInterval(timerInterval);
  timeLeft = QUESTION_TIME;
  updateTimerDisplay();
  updateCandleVisual();

  timerInterval = setInterval(() => {
    if (state.freezeActive) return; // timer frozen
    timeLeft--;
    updateTimerDisplay();
    updateCandleVisual();

    // Tick sound for last 3 seconds
    if (timeLeft <= 3 && timeLeft > 0) Sound.tick();

    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      handleTimeout();
    }
  }, 1000);
}

function updateTimerDisplay() {
  document.getElementById('candleTime').textContent = Math.max(0, timeLeft);
}

function updateCandleVisual() {
  const pct = Math.max(0, timeLeft / QUESTION_TIME);
  // Shrink candle wax
  const wax = document.getElementById('candleWax');
  const maxHeight = 20;
  const curHeight = maxHeight * pct;
  wax.setAttribute('height', curHeight);
  wax.setAttribute('y', 20 + (maxHeight - curHeight));

  // Flame urgency
  const flame = document.getElementById('flameGroup');
  if (pct < 0.33) {
    flame.classList.remove('flame-normal');
    flame.classList.add('flame-urgent');
    // Change flame color to more red
    document.getElementById('candleTime').style.color = 'var(--diwan-error)';
  } else {
    flame.classList.remove('flame-urgent');
    flame.classList.add('flame-normal');
    document.getElementById('candleTime').style.color = 'var(--diwan-ink)';
  }

  // Flame visibility
  flame.style.opacity = timeLeft > 0 ? '1' : '0';
}

function handleTimeout() {
  state.wrongCount++;
  state.currentStreak = 0;
  document.getElementById('streakNum').textContent = state.currentStreak;

  // Show wrong stamp
  showStamp('error', 'غلط');
  Sound.stamp('error');

  // Shake card
  const card = document.getElementById('questionCard');
  card.classList.add('shake');
  setTimeout(() => card.classList.remove('shake'), 400);

  // Highlight correct answer
  const q = mainQuestions[state.currentQuestion];
  const btns = document.querySelectorAll('#optionsGrid .option-btn');
  btns.forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
  });

  // Move to next after delay
  setTimeout(() => advanceQuestion(), 1500);
}

function selectAnswer(index) {
  clearInterval(timerInterval);
  const q = mainQuestions[state.currentQuestion];
  const btns = document.querySelectorAll('#optionsGrid .option-btn');
  const isCorrect = index === q.correct;

  const answerTime = (Date.now() - questionStartTime) / 1000;
  state.answerTimes.push(answerTime);

  // Disable all buttons
  btns.forEach(b => b.disabled = true);

  if (isCorrect) {
    state.correctCount++;
    state.mainScore += POINTS_PER_QUESTION;
    state.currentStreak++;
    if (state.currentStreak > state.maxStreak) state.maxStreak = state.currentStreak;
    document.getElementById('streakNum').textContent = state.currentStreak;

    btns[index].classList.add('correct');
    showStamp('success', 'صح');
    Sound.stamp('success');
    showFloatPoints('+' + POINTS_PER_QUESTION);

    // Streak notification every 3
    if (state.currentStreak > 0 && state.currentStreak % 3 === 0) {
      showStreakNotif(state.currentStreak);
    }
  } else {
    state.wrongCount++;
    state.currentStreak = 0;
    document.getElementById('streakNum').textContent = state.currentStreak;

    btns[index].classList.add('wrong');
    btns[q.correct].classList.add('correct');
    showStamp('error', 'غلط');
    Sound.stamp('error');

    // Shake card
    const card = document.getElementById('questionCard');
    card.classList.add('shake');
    setTimeout(() => card.classList.remove('shake'), 400);
  }

  Sound.penTap();

  setTimeout(() => advanceQuestion(), 1500);
}

function advanceQuestion() {
  const card = document.getElementById('questionCard');
  card.classList.remove('card-slide-in');
  card.classList.add('card-slide-out');
  Sound.paperRustle();

  setTimeout(() => {
    card.classList.remove('card-slide-out');
    loadQuestion(state.currentQuestion + 1);
  }, 300);
}

function showStamp(type, text) {
  const stamp = document.getElementById('stampOverlay');
  stamp.className = 'stamp-overlay stamp-' + type;
  stamp.textContent = text;
  void stamp.offsetWidth;
  stamp.classList.add('animate');
}

function showFloatPoints(text) {
  const el = document.createElement('div');
  el.className = 'float-points';
  el.textContent = text;
  const card = document.getElementById('questionCard');
  const rect = card.getBoundingClientRect();
  el.style.left = (rect.left + rect.width / 2 - 20) + 'px';
  el.style.top = (rect.top + rect.height / 2) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

function showStreakNotif(streak) {
  const el = document.createElement('div');
  el.className = 'streak-notif';
  el.textContent = `🔥 ستريك ${streak}!`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

// ==================== POWER-UPS ====================
function useFiftyFifty() {
  if (!state.hasFifty) return;
  state.hasFifty = false;
  document.getElementById('btnFifty').disabled = true;
  Sound.penTap();

  const q = mainQuestions[state.currentQuestion];
  const btns = document.querySelectorAll('#optionsGrid .option-btn');
  // Find 2 wrong options to remove
  let removed = 0;
  const indices = [0,1,2,3].filter(i => i !== q.correct);
  // Shuffle
  for (let i = indices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }
  indices.slice(0, 2).forEach(i => {
    btns[i].classList.add('strikethrough');
    btns[i].disabled = true;
  });
}

function useFreeze() {
  if (!state.hasFreeze) return;
  state.hasFreeze = false;
  document.getElementById('btnFreeze').disabled = true;
  state.freezeActive = true;
  Sound.penTap();

  // Add freeze badge
  const btn = document.getElementById('btnFreeze');
  const badge = document.createElement('span');
  badge.className = 'freeze-badge';
  badge.textContent = 'ثابت';
  btn.appendChild(badge);

  setTimeout(() => {
    state.freezeActive = false;
    badge.remove();
  }, 4000);
}

// ==================== END MAIN GAME ====================
function endMainGame() {
  clearInterval(timerInterval);
  switchScreen('screenGame', 'screenBonus');
}

// ==================== BONUS ROUND ====================
function initBonusStamps() {
  const container = document.getElementById('bonusStamps');
  container.innerHTML = '';
  bonusQuestions.forEach((_, i) => {
    const span = document.createElement('span');
    span.textContent = '●';
    span.id = 'bonusStamp' + i;
    container.appendChild(span);
  });
}

function startBonusPlay() {
  Sound.stamp('success');
  document.getElementById('bonusIntro').style.display = 'none';
  document.getElementById('bonusPlay').style.display = 'block';
  state.bonusCurrentQ = 0;
  state.bonusCorrect = 0;
  state.bonusWrong = 0;
  state.bonusScore = 0;
  initBonusStamps();
  loadBonusQuestion(0);
}

function skipBonus() {
  Sound.penTap();
  state.bonusScore = 0;
  goToCertificate();
}

function loadBonusQuestion(index) {
  if (index >= bonusQuestions.length) {
    endBonusRound();
    return;
  }
  state.bonusCurrentQ = index;
  const q = bonusQuestions[index];

  const card = document.getElementById('bonusCard');
  card.classList.remove('card-slide-in');
  void card.offsetWidth;
  card.classList.add('card-slide-in');
  Sound.paperRustle();

  document.getElementById('bonusQText').textContent = q.text;
  document.getElementById('bonusScoreInd').textContent = state.bonusScore;

  const grid = document.getElementById('bonusOpts');
  grid.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => selectBonusAnswer(i);
    grid.appendChild(btn);
  });

  // Reset stamp
  const stamp = document.getElementById('bonusStamp');
  stamp.className = 'stamp-overlay';
  stamp.textContent = '';

  // Start bonus timer
  startBonusTimer();
}

let bonusTimerInterval = null;
let bonusTimeLeft = 15;

function startBonusTimer() {
  clearInterval(bonusTimerInterval);
  bonusTimeLeft = 15;
  bonusTimerInterval = setInterval(() => {
    bonusTimeLeft--;
    if (bonusTimeLeft <= 3 && bonusTimeLeft > 0) Sound.tick();
    if (bonusTimeLeft <= 0) {
      clearInterval(bonusTimerInterval);
      handleBonusTimeout();
    }
  }, 1000);
}

function handleBonusTimeout() {
  state.bonusWrong++;
  state.bonusScore -= 10;
  const q = bonusQuestions[state.bonusCurrentQ];

  // Update stamp
  const stampEl = document.getElementById('bonusStamp' + state.bonusCurrentQ);
  stampEl.classList.add('done', 'wrong-stamp');

  const btns = document.querySelectorAll('#bonusOpts .option-btn');
  btns.forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
  });

  showBonusStamp('error', 'غلط');
  Sound.stamp('error');

  updateBonusScoreDisplay('red');
  setTimeout(() => advanceBonusQuestion(), 1500);
}

function selectBonusAnswer(index) {
  clearInterval(bonusTimerInterval);
  const q = bonusQuestions[state.bonusCurrentQ];
  const btns = document.querySelectorAll('#bonusOpts .option-btn');
  const isCorrect = index === q.correct;

  btns.forEach(b => b.disabled = true);

  if (isCorrect) {
    state.bonusCorrect++;
    state.bonusScore += BONUS_POINTS_CORRECT;
    btns[index].classList.add('correct');
    showBonusStamp('success', 'صح');
    Sound.stamp('success');
    showFloatPoints('+' + BONUS_POINTS_CORRECT);

    const stampEl = document.getElementById('bonusStamp' + state.bonusCurrentQ);
    stampEl.classList.add('done', 'correct-stamp');
  } else {
    state.bonusWrong++;
    state.bonusScore += BONUS_POINTS_WRONG;
    btns[index].classList.add('wrong');
    btns[q.correct].classList.add('correct');
    showBonusStamp('error', 'غلط');
    Sound.stamp('error');

    const stampEl = document.getElementById('bonusStamp' + state.bonusCurrentQ);
    stampEl.classList.add('done', 'wrong-stamp');

    const card = document.getElementById('bonusCard');
    card.classList.add('shake');
    setTimeout(() => card.classList.remove('shake'), 400);
  }

  Sound.penTap();
  updateBonusScoreDisplay(isCorrect ? 'green' : 'red');

  setTimeout(() => advanceBonusQuestion(), 1500);
}

function advanceBonusQuestion() {
  const card = document.getElementById('bonusCard');
  card.classList.remove('card-slide-in');
  card.classList.add('card-slide-out');
  Sound.paperRustle();
  setTimeout(() => {
    card.classList.remove('card-slide-out');
    loadBonusQuestion(state.bonusCurrentQ + 1);
  }, 300);
}

function showBonusStamp(type, text) {
  const stamp = document.getElementById('bonusStamp');
  stamp.className = 'stamp-overlay stamp-' + type;
  stamp.textContent = text;
  void stamp.offsetWidth;
  stamp.classList.add('animate');
}

function updateBonusScoreDisplay(color) {
  const ind = document.getElementById('bonusScoreInd');
  ind.textContent = state.bonusScore;
  ind.classList.remove('pulse-green', 'pulse-red');
  void ind.offsetWidth;
  ind.classList.add(color === 'green' ? 'pulse-green' : 'pulse-red');
}

function endBonusRound() {
  clearInterval(bonusTimerInterval);
  document.getElementById('bonusPlay').style.display = 'none';
  document.getElementById('bonusEnd').style.display = 'block';

  // Animate counter
  animateCounter('bonusFinalScore', state.bonusScore, 800);

  // Final stamp
  const wrap = document.getElementById('bonusFinalStampWrap');
  if (state.bonusScore > 0) {
    wrap.innerHTML = '<div class="bonus-final-stamp accepted">مقبول</div>';
  } else {
    wrap.innerHTML = '<div class="bonus-final-stamp rejected">مرفوض</div>';
  }
}

// ==================== CERTIFICATE ====================
function goToCertificate() {
  Sound.penTap();
  state.totalScore = state.mainScore + state.bonusScore;
  switchScreen('screenBonus', 'screenCert');
  setTimeout(() => renderCertificate(), 400);
}

function renderCertificate() {
  Sound.unroll();
  const container = document.getElementById('certContainer');
  container.classList.add('unroll');

  // Name
  document.getElementById('certName').textContent = state.playerName;

  // Photo
  if (state.playerPhoto) {
    const slot = document.getElementById('certPhotoSlot');
    slot.innerHTML = `<img src="${state.playerPhoto}" alt="صورة اللاعب">`;
  }

  // Score counter animation
  animateCounter('certScoreNum', state.totalScore, 1200);

  // Calculate tier using central function
  const maxPossible = calculateMaxPossibleScore();
  const tierResult = calculateTier(state.totalScore, maxPossible);

  // Apply stamp class and text with delay after score animation
  setTimeout(() => {
    const stampEl = document.getElementById('certStamp');
    stampEl.className = 'cert-stamp ' + tierResult.stampClass;
    stampEl.textContent = tierResult.stampText;
    Sound.stamp('success');
  }, 1200);

  // Egyptian phrase with delay after stamp
  setTimeout(() => {
    const phraseEl = document.getElementById('certPhrase');
    phraseEl.textContent = tierResult.phrase;
    phraseEl.style.animationDelay = '0s';
    Sound.penTap();
  }, 1700);

  // Badges
  const badges = calculateBadges();
  const row = document.getElementById('badgesRow');
  row.innerHTML = '';
  badges.forEach((badge, i) => {
    const el = document.createElement('span');
    el.className = 'badge';
    el.textContent = badge;
    el.style.animationDelay = (2.0 + i * 0.2) + 's';
    row.appendChild(el);
  });
}

function calculateBadges() {
  const badges = [];
  const avgTime = state.answerTimes.length > 0
    ? state.answerTimes.reduce((a, b) => a + b, 0) / state.answerTimes.length
    : 999;
  if (avgTime < 5) badges.push('⚡ سريع البديهة');
  if (state.correctCount >= 4) badges.push('🧩 عبقري الألغاز');
  if (state.maxStreak >= 3) badges.push('🔥 ما وقفش');
  if (state.totalScore >= 80) badges.push('🏆 بطل الديوان');
  if (state.bonusScore > 0) badges.push('💎 جولة المخاطرة');
  return badges;
}

function animateCounter(elementId, target, duration) {
  const el = document.getElementById(elementId);
  const start = 0;
  const startTime = Date.now();
  function update() {
    const elapsed = Date.now() - startTime;
    const progress = Math.min(elapsed / duration, 1);
    // Ease out
    const eased = 1 - Math.pow(1 - progress, 3);
    el.textContent = Math.round(start + (target - start) * eased);
    if (progress < 1) requestAnimationFrame(update);
  }
  update();
}

// ==================== SHARE & DOWNLOAD ====================
function shareCert() {
  Sound.penTap();
  const text = `ديوان الحكمة — ${state.playerName} حصل على ${state.totalScore} نقطة! 🏆`;
  if (navigator.share) {
    navigator.share({ title: 'الديوان', text }).catch(() => {});
  } else {
    // Fallback: copy to clipboard
    navigator.clipboard.writeText(text).then(() => {
      alert('تم النسخ!');
    }).catch(() => {
      alert(text);
    });
  }
}

function downloadCert() {
  Sound.penTap();
  const cert = document.getElementById('certPaper');
  if (typeof html2canvas === 'undefined') {
    alert('html2canvas غير متوفر');
    return;
  }
  html2canvas(cert, {
    backgroundColor: null,
    scale: 2,
    useCORS: true,
  }).then(canvas => {
    const link = document.createElement('a');
    link.download = 'diwan-certificate.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }).catch(err => {
    console.error('Download error:', err);
  });
}
